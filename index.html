<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coverflow Slider</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Coverflow Slider</h1>

    <div class="coverflow" id="coverflow">
      <!-- کارت‌ها با JavaScript ساخته می‌شوند -->
    </div>

    <div class="controls">
      <button id="prev" aria-label="Previous">&#8592;</button>
      <span id="label" class="label"></span>
      <button id="next" aria-label="Next">&#8594;</button>
    </div>

    <p class="hint">کلیک روی هر کارت یا دکمه‌ها — یا کلیدهای ← → روی کیبورد</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
